# Стенд демо - состав 3 (ai-factory, docs/compositions): все роли играют ИИ-персонажи, и решения
# своей области (утвердить нарезку, отдать задачу агенту, выложить, правило) принимают они же.
# Владелец держит все роли и может вмешаться. Роли-помощники (<роль>-ai) остаются: по ним агент
# фабрики назначает задачу на персонажа своей роли.
roles:
  product-owner: [yuriy, po-bot]
  project-manager: [yuriy, pm-bot]
  architect: [yuriy, architect-bot]
  designer: [yuriy, designer-bot]
  frontend-developer: [yuriy, frontend-bot] # веб: web/, сквозные проверки e2e/
  backend-developer: [yuriy, backend-bot] # API и домен: api/
  qa: [yuriy, qa-bot]
  devops: [yuriy, devops-bot]
  operations: [yuriy, devops-bot]
  release-manager: [yuriy, devops-bot]
  product-owner-ai: [po-bot]
  project-manager-ai: [pm-bot]
  architect-ai: [architect-bot]
  designer-ai: [designer-bot]
  frontend-developer-ai: [frontend-bot]
  backend-developer-ai: [backend-bot]
  qa-ai: [qa-bot]
  devops-ai: [devops-bot]

# Точки решения фабрики и роли, которым они разрешены.
decisions:
  deploy: [devops, release-manager] # !выкладка
  approve-slice: [project-manager, product-owner] # !утвердить
  slice: [project-manager, product-owner, project-manager-ai] # !нарезка - предложение, утверждает approve-slice
  submit-task: [project-manager, product-owner, architect, frontend-developer, backend-developer] # !задача, метка agent, submit_task в MCP
  story: [product-owner, project-manager] # метка story; стори из вики - по автору версии страницы
  propose-rule: [architect] # !правила
  rerun-checks: [qa, frontend-developer, backend-developer, devops, qa-ai, frontend-developer-ai, backend-developer-ai, devops-ai] # !e2e, !ci, !судья
  design-check: [designer, product-owner, designer-ai] # !макет
