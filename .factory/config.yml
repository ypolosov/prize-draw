# Настройки фабрики для репозитория: меняет только человек (страж фабрики не публикует
# изменения .factory/ и .github/ от агентов).
# Команды проверок цели: фабрика и CI вызывают их, инструменты - выбор цели.
checks:
  lint: npm run lint
  format: npm run format:check
  typecheck: npm run typecheck
  test: npm test
  e2e: npm run e2e
  spec: npm run spec:validate

# Роли агентов фабрики: метка agent:frontend или agent:backend на задаче. Страж фабрики не
# публикует изменение роли вне её путей; метка agent - разработчик на весь репозиторий.
roles:
  frontend:
    paths:
      allowed: [web/, e2e/]
  backend:
    paths:
      allowed: [api/]

# Правила-стражи: добавленные строки изменения в paths не должны совпадать с forbid.
rules:
  - id: no-random-outside-seed
    source: docs/adr/ADR-3-reproducible-draw.md
    message: "случайность в api/src/ - только из зерна розыгрыша (ADR-3): Math.random и randomInt запрещены"
    forbid: 'Math\.random|randomInt\('
    paths: [api/src/]
  - id: utc-dates-for-claim-deadline
    source: "замечания к PR 114, 115, 118"
    message: "Даты считаются в локальном часовом поясе: для срока подтверждения приза используйте UTC (getUTC*/setUTC*, Date.UTC или timestamp)"
    paths: ["api/src/", "web/src/"]
    forbid: "\\.(get(FullYear|Month|Date|Day|Hours|Minutes|Seconds)|set(FullYear|Month|Date|Hours|Minutes|Seconds)|toLocale(Date|Time)?String)\\s*\\("
