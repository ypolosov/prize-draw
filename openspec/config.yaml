# OpenSpec проекта: схема фабрики (openspec/schemas/factory) и правила артефактов.
# Изменение пишет человек со своим экзокортексом (навыки OpenSpec - .claude/skills и
# .agents/skills), утверждает владелец слиянием PR; задачи по нему делают агенты фабрики.
schema: factory

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Проект: розыгрыш призов - API на NestJS и PostgreSQL (api/), веб на React и Vite (web/),
  сквозные проверки на Playwright (e2e/). Правила предметной области R1-R6 - в README.md,
  решения - ADR в docs/adr/; правила и выбор победителей - чистые функции в api/src/domain.
  Фабрика: задача Jira с меткой agent -> агент в отдельном PR; изменение OpenSpec задачи -
  каталог openspec/changes/<ключ задачи в нижнем регистре>-<имя>/, например
  draw-12-redraw-unclaimed-prize: фабрика находит его по ключу и отдаёт агенту.

rules:
  proposal:
    - 'Первая строка раздела Why - ключ задачи Jira, например "Задача: DRAW-12".'
    - 'Добавь раздел "Критерии успеха" - наблюдаемые признаки готовности всего изменения.'
    - 'Добавь раздел "Вне рамок" - что изменение сознательно не делает.'
    - 'Назови правила R1-R6 и ADR, которые изменение затрагивает; противоречие им - только через новое решение человека (ADR).'
  specs:
    - 'Каждый сценарий проверяем снаружи - запрос к API и ответ или действие на экране и что на нём видно.'
  design:
    - 'Каждое решение записывай как ADR - контекст, решение, рассмотренные альтернативы, последствия.'
  tasks:
    - 'Одна задача - один PR одного агента, не больше 2-3 часов работы человека.'
    - 'Номер задачи X.Y - в начале описания, зависимости - в конце, например "(после 1.1)".'
    - 'У каждой задачи укажи сценарии требований, которые она закрывает, например "[сценарии - Повтор розыгрыша]".'
    - 'Не выделяй отдельные задачи на тесты - модульные тесты входят в задачу (тест до кода), сквозные - в задачу экрана.'
    - 'Пути файлов - TypeScript (`api/src/**/*.ts`, `api/test/*.test.ts`, `web/src/**/*.tsx`, `e2e/tests/*.spec.ts`).'
